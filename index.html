<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just One Counter :)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f0f0f0;
      overflow: hidden;
      font-family: monospace;
      width: 100vw;
      height: 100vh;
    }

    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #e74c3c;
      color: white;
      text-align: center;
      padding: 8px;
      font-size: 1.1em;
      font-weight: bold;
      z-index: 9999;
      user-select: none;
    }

    #stop-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2ecc71;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      z-index: 9999;
      transition: background 0.2s;
      user-select: none;
    }

    #stop-btn:hover {
      background: #27ae60;
    }

    #arena {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .counter {
      position: absolute;
      background: white;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      user-select: none;
      text-align: center;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
      animation: wobble 2s infinite ease-in-out;
      transition: transform 0.1s;
      min-width: 80px;
    }

    .counter:active {
      transform: scale(0.95);
    }

    .label {
      font-size: 0.85em;
      color: #666;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .count {
      font-size: 2em;
      font-weight: bold;
      color: #e74c3c;
      line-height: 1.1;
    }

    @keyframes wobble {
      0%, 100% {
        rotate: -1deg;
      }
      50% {
        rotate: 1deg;
      }
    }

    /* Staggered wobble phases so not all counters move in unison */
    .counter:nth-child(2n)   { animation-delay: -0.5s; }
    .counter:nth-child(3n)   { animation-delay: -1.0s; }
    .counter:nth-child(5n)   { animation-delay: -1.5s; }
    .counter:nth-child(7n)   { animation-delay: -0.3s; }
    .counter:nth-child(11n)  { animation-delay: -0.8s; }

    /* ── Fake Login Panel ──────────────────────────────────────────────────── */
    #login-trigger-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 4px 10px;
      font-size: 0.8em;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
    }

    #login-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 11000;
      justify-content: center;
      align-items: center;
    }

    #login-overlay.visible {
      display: flex;
      animation: slideInRight 0.35s ease-out;
    }

    @keyframes slideInRight {
      from { transform: translateX(120%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    #login-panel {
      background: white;
      border-radius: 12px;
      padding: 32px 28px;
      width: 340px;
      max-width: 90vw;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #login-close-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      font-size: 1.4em;
      cursor: pointer;
      color: #999;
      transition: color 0.1s;
      line-height: 1;
    }

    #login-logo {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 8px;
    }

    #login-title {
      text-align: center;
      font-size: 1.3em;
      font-weight: 700;
      margin-bottom: 4px;
      color: #111;
    }

    #login-subtitle {
      text-align: center;
      font-size: 0.85em;
      color: #666;
      margin-bottom: 20px;
    }

    #login-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.82em;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    #login-panel label {
      display: block;
      font-size: 0.82em;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
      margin-top: 12px;
    }

    #login-panel input[type="text"],
    #login-panel input[type="password"] {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.9em;
      outline: none;
      transition: border-color 0.15s;
    }

    #login-panel input:focus { border-color: #6366f1; }

    .pw-wrap {
      position: relative;
    }

    .pw-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1em;
    }

    #login-submit-btn {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #login-submit-btn:hover { background: #4f46e5; }
    #login-submit-btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    #captcha-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin: 10px 0;
    }

    #captcha-grid div {
      background: #e5e7eb;
      height: 72px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.1s;
    }

    #captcha-grid div.selected { border-color: #6366f1; background: #eef2ff; }

    /* ── Freeze feature ─────────────────────────────────────────────────────── */
    #freeze-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #3498db;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      z-index: 9999;
      transition: background 0.2s;
      user-select: none;
    }

    #freeze-btn:hover {
      background: #2980b9;
    }

    #freeze-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(200, 200, 210, 0.35);
      backdrop-filter: blur(1.5px) grayscale(60%) brightness(0.88);
      -webkit-backdrop-filter: blur(1.5px) grayscale(60%) brightness(0.88);
      z-index: 10000;
      cursor: not-allowed;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.04) 2px,
        rgba(0, 0, 0, 0.04) 4px
      );
      pointer-events: none;
    }

    .not-responding-dialog {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ece9d8;            /* classic Windows XP dialog beige */
      border: 2px solid #0054a6;
      border-radius: 4px;
      width: 340px;
      font-family: 'Tahoma', monospace;
      font-size: 13px;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
      cursor: default;
    }

    .dialog-title {
      background: linear-gradient(to right, #0054a6, #2d93e8);
      color: white;
      padding: 4px 8px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dialog-icon { font-size: 14px; }

    .dialog-body {
      padding: 16px 12px;
      color: #000;
      line-height: 1.5;
    }

    .dialog-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding-bottom: 12px;
    }

    .dialog-buttons button {
      padding: 4px 24px;
      font-size: 12px;
      background: #ece9d8;
      border: 2px solid #aaa;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Tahoma', monospace;
    }

    .dialog-buttons button:hover { background: #ddd; }

    /* Pause all counter animations while frozen */
    body.is-frozen .counter {
      animation-play-state: paused;
      pointer-events: none;
    }

    /* ── Achievement Toasts ─────────────────────────────────────────────────── */
    #achievement-btn {
      position: absolute;
      right: 90px;           /* left of the 🔒 Login button at right:12px */
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.5);
      padding: 4px 8px;
      font-size: 0.85em;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
    }

    #toast-stack {
      position: fixed;
      bottom: 20px;
      right: 70px;           /* left of the STOP button at right:20px */
      width: 280px;
      display: flex;
      flex-direction: column-reverse; /* newest toast at bottom */
      gap: 8px;
      z-index: 12000;
      pointer-events: none;  /* container passes through; individual toasts handle events */
    }

    .achievement-toast {
      background: white;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.22), 0 0 0 2px #f59e0b;
      padding: 12px 14px 12px 12px;
      width: 280px;
      position: relative;
      pointer-events: all;
      animation: toastSlideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    @keyframes toastSlideIn {
      from { transform: translateX(320px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }

    @keyframes toastSlideOut {
      from { transform: translateX(0);     opacity: 1; max-height: 100px; margin-bottom: 0; }
      to   { transform: translateX(320px); opacity: 0; max-height: 0;    margin-bottom: -8px; }
    }

    .achievement-toast.dismissing {
      animation: toastSlideOut 0.25s ease-in forwards;
    }

    .toast-header {
      font-size: 0.7em;
      font-weight: 700;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toast-body {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .toast-icon {
      font-size: 1.8em;
      line-height: 1;
      flex-shrink: 0;
    }

    .toast-text {
      flex: 1;
    }

    .toast-title {
      font-size: 0.88em;
      font-weight: 700;
      color: #111;
      margin-bottom: 2px;
    }

    .toast-desc {
      font-size: 0.75em;
      color: #555;
      line-height: 1.3;
    }

    .toast-close {
      position: absolute;
      top: 8px;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 1em;
      line-height: 1;
      padding: 2px 4px;
      transition: color 0.1s;
    }

    .toast-close:hover { color: #888; }

    /* Progress bar that drains during auto-dismiss */
    .toast-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: #f59e0b;
      border-radius: 0 0 0 10px;
      transition: width linear;
    }

    /* Clear All button — floating above the stack */
    #toast-clear-btn {
      position: fixed;
      bottom: calc(20px + var(--stack-height, 0px) + 8px);
      right: 70px;
      width: 280px;
      padding: 8px;
      background: #1f2937;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.82em;
      font-weight: 600;
      cursor: pointer;
      z-index: 12001;
      text-align: center;
      font-family: monospace;
      transition: background 0.15s;
    }

    #toast-clear-btn:hover { background: #374151; }
  </style>
</head>
<body>
  <div id="header">
    You have <span id="counter-count">0</span> counter(s). Good job.
    <button id="achievement-btn" onclick="unlockAchievement()">🏆</button>
    <button id="login-trigger-btn" onclick="showLogin()">🔒 Login</button>
  </div>

  <button id="stop-btn" onclick="spawnBurst()">STOP</button>

  <!-- Freeze button — fixed bottom-left -->
  <button id="freeze-btn" onclick="triggerFreeze()">FREEZE</button>

  <!-- Freeze overlay — hidden by default -->
  <div id="freeze-overlay">
    <div class="scanlines"></div>
    <div class="not-responding-dialog">
      <div class="dialog-title">
        <span class="dialog-icon">⚠</span>
        index.html – Not Responding
      </div>
      <div class="dialog-body">
        This program has stopped responding.<br>
        Would you like to end the process?
      </div>
      <div class="dialog-buttons">
        <button onclick="forceQuit()">Force Quit</button>
        <button onclick="forceQuit()">OK</button>
      </div>
    </div>
  </div>

  <div id="arena"></div>

  <!-- Login Panel Overlay -->
  <div id="login-overlay">
    <div id="login-panel">
      <button id="login-close-btn" onmouseenter="escapeCursor(this)" onclick="escapeCursor(this)">×</button>
      <div id="login-logo">🏢</div>
      <h2 id="login-title">Welcome Back</h2>
      <p id="login-subtitle">Sign in to your account</p>

      <div id="login-error" style="display:none"></div>

      <div id="login-form-area">
        <label>Email or Username</label>
        <input id="login-user" type="text" placeholder="you@company.com" autocomplete="off">

        <label>Password</label>
        <div class="pw-wrap">
          <input id="login-pass" type="password" placeholder="••••••••">
          <button class="pw-toggle" onclick="togglePassword()">👁</button>
        </div>

        <button id="login-submit-btn" onclick="attemptLogin()">Sign In</button>
      </div>

      <!-- Phase 6: fake captcha (hidden until needed) -->
      <div id="captcha-area" style="display:none">
        <p>Select all images containing a <strong>disappointed developer</strong>:</p>
        <div id="captcha-grid"></div>
        <button onclick="shuffleCaptcha()">I'm not a robot</button>
      </div>
    </div>
  </div>

  <!-- Toast stack container — fixed bottom-right, above login overlay -->
  <div id="toast-stack"></div>

  <!-- Clear All button — hidden until 4+ toasts are stacked -->
  <button id="toast-clear-btn" onclick="clearAllToasts()" style="display:none">
    Clear All (<span id="toast-clear-count">0</span>)
  </button>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let totalCounters = 0;

    // ── Audio ──────────────────────────────────────────────────────────────────
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      // Resume if suspended (autoplay policy)
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playBlip() {
      try {
        const ctx = getAudioCtx();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.frequency.value = 300 + Math.random() * 800;
        o.type = ['sine', 'square', 'sawtooth'][Math.floor(Math.random() * 3)];
        g.gain.setValueAtTime(0.08, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        o.start();
        o.stop(ctx.currentTime + 0.15);
      } catch (e) {
        // Silently ignore audio errors — visuals still work
      }
    }

    // ── Utilities ──────────────────────────────────────────────────────────────
    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function updateHeader() {
      document.getElementById('counter-count').textContent = totalCounters;
    }

    // ── Draggable ──────────────────────────────────────────────────────────────
    function makeDraggable(el) {
      let ox = 0, oy = 0;
      let dragging = false;

      el.addEventListener('mousedown', function (e) {
        // Don't interfere with click if no movement happens
        ox = e.clientX - el.offsetLeft;
        oy = e.clientY - el.offsetTop;
        dragging = false;

        function onMove(e) {
          dragging = true;
          el.style.left = (e.clientX - ox) + 'px';
          el.style.top  = (e.clientY - oy) + 'px';
        }

        function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      // Prevent click from firing after a drag
      el.addEventListener('click', function (e) {
        if (dragging) {
          e.stopImmediatePropagation();
          dragging = false;
        }
      }, true);
    }

    // ── Counter spawning ───────────────────────────────────────────────────────
    function spawnCounter() {
      const id = ++totalCounters;
      updateHeader();

      // Trigger achievement every 5 counters spawned
      if (totalCounters % 5 === 0) unlockAchievement();

      const el = document.createElement('div');
      el.className = 'counter';

      // Random position within safe viewport bounds (below header bar)
      el.style.left = rand(2, 85) + 'vw';
      el.style.top  = rand(8, 80) + 'vh';

      // Gradually shrink font so the pile of counters stays legible but cramped
      const fontSize = Math.max(9, 22 - id * 0.25);
      el.style.fontSize = fontSize + 'px';

      // Each counter gets its own z-index layer so newer ones appear on top
      el.style.setProperty('--z', id);
      el.style.zIndex = id;

      el.innerHTML = `
        <div class="label">Counter #${id}</div>
        <div class="count">0</div>
      `;

      // Click: increment own count, spawn a new counter, play audio
      el.addEventListener('click', function () {
        const countEl = el.querySelector('.count');
        countEl.textContent = parseInt(countEl.textContent, 10) + 1;
        spawnCounter();
        playBlip();
        onCounterClick();
      });

      makeDraggable(el);

      document.getElementById('arena').appendChild(el);
      return el;
    }

    // ── STOP button ────────────────────────────────────────────────────────────
    const STOP_LABELS = ['PLEASE', 'STILL NO', 'NOPE', 'LOL', ':(', 'WHY', 'NO U', 'HAHA'];
    let stopLabelIndex = 0;

    function spawnBurst() {
      for (let i = 0; i < 5; i++) {
        spawnCounter();
      }
      const btn = document.getElementById('stop-btn');
      btn.textContent = STOP_LABELS[stopLabelIndex % STOP_LABELS.length];
      stopLabelIndex++;
    }

    // ── Screen Freeze ──────────────────────────────────────────────────────────
    const FREEZE_LABELS = ['FREEZE', 'FROZEN 🥶', 'STILL FROZEN', 'REALLY FROZEN', 'SO FROZEN'];
    let freezeLabelIndex = 0;
    let freezeTimeout = null;

    function triggerFreeze() {
      document.body.classList.add('is-frozen');
      document.getElementById('freeze-overlay').style.display = 'block';
      const btn = document.getElementById('freeze-btn');
      btn.textContent = FREEZE_LABELS[(++freezeLabelIndex) % FREEZE_LABELS.length];
    }

    function forceQuit() {
      // "Fix" it by unfreezing — but spawn 3 counters and immediately re-freeze
      for (let i = 0; i < 3; i++) spawnCounter();
      document.body.classList.remove('is-frozen');
      document.getElementById('freeze-overlay').style.display = 'none';
      clearTimeout(freezeTimeout);
      freezeTimeout = setTimeout(triggerFreeze, 800);
    }

    // ── Fake Login Panel ─────────────────────────────────────────────────────
    const LOGIN_ERRORS = [
      "Incorrect password. 2 attempts remaining.",
      "Account temporarily locked. Try again in 847 minutes.",
      "Security verification required — please enter your mother's maiden emoji 👩",
      "Your password has expired. New password must contain ≥1 hieroglyph and a prime number.",
      "We've sent a 9-digit code to your email. (Check spam. And junk. And trash. And recycling.)",
      "__CAPTCHA__",    // special: shows captcha
      "You have been reported to IT. Please hold.",
      "__SUCCESS__"     // special: fakes success then re-opens
    ];
    let loginAttempt = 0;
    let closeEscapes = 0;
    let totalClicksForLogin = 0;   // incremented on every counter click
    const LOGIN_AUTO_TRIGGER = 15; // show login after 15 total clicks

    function showLogin() {
      const overlay = document.getElementById('login-overlay');
      overlay.classList.add('visible');
      // Reset form state
      document.getElementById('login-user').value = '';
      document.getElementById('login-pass').value = '';
      document.getElementById('login-pass').type = 'password';
      document.getElementById('login-pass').disabled = false;
      document.getElementById('login-user').disabled = false;
      document.getElementById('login-error').style.display = 'none';
      document.getElementById('login-form-area').style.display = 'block';
      document.getElementById('captcha-area').style.display = 'none';
      const btn = document.getElementById('login-submit-btn');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }

    function hideLogin() {
      document.getElementById('login-overlay').classList.remove('visible');
    }

    function attemptLogin() {
      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      setTimeout(() => {
        const phase = LOGIN_ERRORS[loginAttempt % LOGIN_ERRORS.length];
        loginAttempt++;

        if (phase === '__CAPTCHA__') {
          document.getElementById('login-form-area').style.display = 'none';
          showCaptcha();
          return;
        }

        if (phase === '__SUCCESS__') {
          showError('✅ Congratulations! Login successful.');
          btn.textContent = 'Sign In';
          btn.disabled = false;
          setTimeout(() => {
            hideLogin();
            setTimeout(() => {
              showLogin();
              showError('Session expired. Please log in again.');
            }, 1500);
          }, 1800);
          return;
        }

        if (phase.includes("Please hold")) {
          showError(phase);
          btn.textContent = 'Contacting IT…';
          document.getElementById('login-user').disabled = true;
          document.getElementById('login-pass').disabled = true;
          // stays disabled — "forever"
          return;
        }

        showError(phase);
        btn.disabled = false;
        btn.textContent = 'Try Again';
      }, 1200);
    }

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function togglePassword() {
      const f = document.getElementById('login-pass');
      f.type = f.type === 'password' ? 'text' : 'password';
    }

    // Close button escape logic
    function escapeCursor(btn) {
      closeEscapes++;
      if (closeEscapes >= 3) {
        btn.style.display = 'none';
        // Plant a tiny × in a random corner of the panel
        const panel = document.getElementById('login-panel');
        const tiny = document.createElement('button');
        tiny.textContent = '×';
        tiny.style.cssText = 'position:absolute;font-size:8px;background:none;border:none;cursor:pointer;color:#ddd;';
        tiny.style.top = (Math.random() > 0.5 ? '4px' : 'auto');
        tiny.style.bottom = (tiny.style.top === 'auto' ? '4px' : 'auto');
        tiny.style.left = (Math.random() > 0.5 ? '4px' : 'auto');
        tiny.style.right = (tiny.style.left === 'auto' ? '4px' : 'auto');
        tiny.onclick = hideLogin;
        panel.appendChild(tiny);
        return;
      }
      const positions = [
        { top: '12px', right: '14px', left: 'auto', bottom: 'auto' },
        { top: 'auto', right: '14px', left: 'auto', bottom: '12px' },
        { top: '12px', right: 'auto', left: '14px', bottom: 'auto' },
        { top: 'auto', right: 'auto', left: '14px', bottom: '12px' },
      ];
      const pos = positions[Math.floor(Math.random() * positions.length)];
      Object.assign(btn.style, pos);
    }

    // Fake CAPTCHA
    const CAPTCHA_EMOJIS = ['😭', '😤', '😩', '🤦', '😫', '🤷', '😞', '😕'];
    function showCaptcha() {
      document.getElementById('captcha-area').style.display = 'block';
      shuffleCaptcha();
    }

    function shuffleCaptcha() {
      const grid = document.getElementById('captcha-grid');
      grid.innerHTML = '';
      [...CAPTCHA_EMOJIS].sort(() => Math.random() - 0.5).forEach(e => {
        const cell = document.createElement('div');
        cell.textContent = e;
        cell.onclick = () => {
          cell.classList.toggle('selected');
          setTimeout(shuffleCaptcha, 400); // shuffle on any click
        };
        grid.appendChild(cell);
      });
    }

    // Auto-trigger: called inside the existing counter click handler
    function onCounterClick() {
      totalClicksForLogin++;
      if (totalClicksForLogin === LOGIN_AUTO_TRIGGER) {
        showLogin();
      }
    }

    // ── Achievement Toasts ─────────────────────────────────────────────────────
    const ACHIEVEMENTS = [
      { icon: '🌱', title: 'First Steps',             desc: 'You clicked something. Gold star.' },
      { icon: '⚡', title: 'Speed Demon',             desc: '5 counters? You\'re unstoppable. Please stop.' },
      { icon: '🧮', title: 'Mathlete',                desc: '10 counters. A true numerical achievement.' },
      { icon: '🌊', title: 'Flood Warning',           desc: '15 counters. Authorities have been notified.' },
      { icon: '🤡', title: 'Clown Level: Apprentice', desc: 'You\'re really doing this.' },
      { icon: '😤', title: 'Commitment Issues',       desc: '30 counters. Do you have somewhere to be?' },
      { icon: '🦠', title: 'Exponential Growth',      desc: 'The CDC is monitoring the situation.' },
      { icon: '🎭', title: 'Master of Chaos',         desc: 'We have both respect and pity for you.' },
      { icon: '🌀', title: 'Vortex Mode',             desc: 'The void stares back.' },
      { icon: '🧠', title: 'Neuron Wastage Expert',   desc: 'You have spent genuine time on this.' },
      { icon: '💀', title: 'Beyond Help',             desc: 'There is no achievement number 12. Please leave.' },
      { icon: '🔄', title: 'Infinite Loop',           desc: 'Secret achievement: still not touching grass.' },
    ];
    const ACHIEVEMENT_LOOP = { icon: '🔁', title: 'Déjà Vu', desc: 'You\'ve been here before. And you came back.' };

    let achievementIndex = 0;
    let activeToasts = [];            // toast DOM elements currently visible
    const AUTO_DISMISS_THRESHOLD = 5; // first 5 achievements auto-dismiss
    const STACK_CLEAR_THRESHOLD = 4;  // show "Clear All" when this many are stacked

    function unlockAchievement() {
      const data = achievementIndex < ACHIEVEMENTS.length
        ? ACHIEVEMENTS[achievementIndex]
        : ACHIEVEMENT_LOOP;
      achievementIndex++;

      const toast = document.createElement('div');
      toast.className = 'achievement-toast';

      const autoDismiss = achievementIndex <= AUTO_DISMISS_THRESHOLD;

      toast.innerHTML = `
        <div class="toast-header">🏆 Achievement Unlocked!</div>
        <div class="toast-body">
          <div class="toast-icon">${data.icon}</div>
          <div class="toast-text">
            <div class="toast-title">${data.title}</div>
            <div class="toast-desc">${data.desc}</div>
          </div>
        </div>
        <button class="toast-close" onmouseenter="wiggleToastClose(this)">×</button>
        ${autoDismiss ? '<div class="toast-progress" style="width:100%"></div>' : ''}
      `;

      // Wire close handler programmatically to capture this toast reliably
      toast.querySelector('.toast-close').onclick = () => dismissToast(toast, true);

      document.getElementById('toast-stack').appendChild(toast);
      activeToasts.push(toast);
      playChime();
      updateClearAllBtn();

      if (autoDismiss) {
        const bar = toast.querySelector('.toast-progress');
        requestAnimationFrame(() => {
          bar.style.transitionDuration = '5s';
          bar.style.width = '0%';
        });
        setTimeout(() => dismissToast(toast, false), 5000);
      }
    }

    function dismissToast(toast, spawnPenalty = true) {
      if (!activeToasts.includes(toast)) return;
      activeToasts = activeToasts.filter(t => t !== toast);
      toast.classList.add('dismissing');
      toast.addEventListener('animationend', () => toast.remove(), { once: true });
      if (spawnPenalty) spawnCounter(); // punishment for successfully closing
      updateClearAllBtn();
    }

    function wiggleToastClose(btn) {
      const toast = btn.closest('.achievement-toast');
      const maxX = toast.offsetWidth  - btn.offsetWidth  - 8;
      const maxY = toast.offsetHeight - btn.offsetHeight - 8;
      btn.style.top   = Math.max(4, Math.random() * maxY) + 'px';
      btn.style.right = 'auto';
      btn.style.left  = Math.max(4, Math.random() * maxX) + 'px';
    }

    function clearAllToasts() {
      const count = activeToasts.length;
      [...activeToasts].forEach(t => {
        activeToasts = activeToasts.filter(x => x !== t);
        t.classList.add('dismissing');
        t.addEventListener('animationend', () => t.remove(), { once: true });
      });
      for (let i = 0; i < count; i++) spawnCounter();
      updateClearAllBtn();
    }

    function updateClearAllBtn() {
      const btn = document.getElementById('toast-clear-btn');
      const count = activeToasts.length;
      if (count >= STACK_CLEAR_THRESHOLD) {
        document.getElementById('toast-clear-count').textContent = count;
        btn.style.display = 'block';
        const stackHeight = document.getElementById('toast-stack').offsetHeight;
        btn.style.bottom = (20 + stackHeight + 12) + 'px';
      } else {
        btn.style.display = 'none';
      }
    }

    function playChime() {
      try {
        const ctx = getAudioCtx();
        const notes = [523.25, 659.25, 783.99]; // C5, E5, G5 — major triad
        notes.forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.value = freq;
          const t = ctx.currentTime + i * 0.12;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.12, t + 0.05);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          o.start(t); o.stop(t + 0.3);
        });
      } catch (e) {}
    }

    // ── Init ───────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
      spawnCounter();
    });
  </script>
</body>
</html>
